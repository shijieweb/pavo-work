# templates/camera_move_v5.yaml
# 来源：prompt_training.py build_variants 的 camera_move_v5 分支（第五轮·老板拍板：2帧首尾帧 + 短时长）
# 单镜只做"首帧→尾帧简单过渡"，复杂运镜靠镜头拆解。anchor_far 缺失时 fallback 为 anchor。
name: camera_move_v5
description: "2帧首尾帧 + 短时长(81帧) + 简单过渡（第五轮）"
type: camera_move

variables:
  first: "asset_frame_start"
  last: "asset_frame_end"
  anchor: "ref.remote_url"
  base_prompt: "shot.video_prompt"
  anchor_far:
    file: "experiments/anchor_far.txt"
    default: "{{anchor}}"

constants:
  SIMPLE2: >
    Smooth transition from keyframe 1 to keyframe 2 of the same scene.
    Animate: the man walks forward with natural gait, subtle breathing, hair moving gently,
    background lights flickering softly.
    Frame 1: empty urban street at midnight, cold blue night, street lamp, glass office building.
    Frame 2: the Chinese male programmer in medium shot, tired expression, same white shirt and black backpack.
    Keep stable: character's face, hairstyle, and clothing fully consistent,
    consistent camera angle, natural motion, no jumps, no morphing.
  SIMPLE2_FAR: >
    Smooth transition from keyframe 1 to keyframe 2 of the same scene.
    Animate: the man walks toward the camera from the distance, getting slightly closer,
    hair moving gently in the night wind, background lights flickering softly.
    Frame 1: empty urban street at midnight, cold blue night, street lamp, glass office building.
    Frame 2: the same man walking toward the camera in far shot, small figure,
    same white shirt and black backpack, tired posture.
    Keep stable: character's face, hairstyle, and clothing fully consistent,
    consistent camera angle, natural motion, no jumps, no morphing.
  SIMPLE2_CN: "从第一个关键帧到第二个关键帧平滑过渡。运动：男人从远景缓慢走向镜头，脚步逐渐清晰靠近，头发被夜风轻轻吹动，背景路灯灯光微微闪烁，冷蓝夜色不变。保持稳定：角色面容、发型、白衬衫和背包完全一致，镜头角度不变，场景过渡自然，无跳变无变形。"

variants:
  v13:
    hypothesis: "2帧[空景→中景]+81帧(3.4s)+简单过渡：单镜只做简单过渡"
    goal: "单镜只做简单过渡"
    reference: "第五轮·单镜简单过渡"
    num_frames: 81
    keyframes:
      - role: "起点空景"
        src: "{{first}}"
      - role: "尾帧人物中景"
        src: "{{last}}"
    prompt: "{{SIMPLE2}}"

  v14:
    hypothesis: "2帧[空景→远景小]+81帧+简单过渡：运镜推近拆解的第一镜"
    goal: "运镜推近拆成 2 镜：远景镜 + 中景镜"
    reference: "第五轮·运镜拆解第一镜"
    num_frames: 81
    keyframes:
      - role: "起点空景"
        src: "{{first}}"
      - role: "尾帧人物远景小"
        src: "{{anchor_far}}"
    prompt: "{{SIMPLE2_FAR}}"

  v15:
    hypothesis: "2帧+中文官方格式：状态A→状态B+光效细节（知识库中文例子）"
    goal: "中文官方格式对照"
    reference: "第五轮·中文格式"
    num_frames: 81
    keyframes:
      - role: "起点空景"
        src: "{{first}}"
      - role: "尾帧人物远景小"
        src: "{{anchor_far}}"
    prompt: "{{SIMPLE2_CN}}"
