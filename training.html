<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 提示词训练营 · 实验看板 v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:12px; margin-bottom:16px; }
  .stats { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:8px 14px; font-size:12px; }
  .stat b { color:#38bdf8; }
  .exp { background:#1e293b; border:1px solid #334155; border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .exp-head { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; flex-wrap:wrap; }
  .exp-head:hover { background:#243449; }
  .exp-id { font-weight:700; font-size:14px; color:#38bdf8; }
  .exp-meta { color:#94a3b8; font-size:11px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .b-done { background:#334155; color:#94a3b8; }
  .b-candidate { background:#f59e0b22; color:#fbbf24; border:1px solid #f59e0b55; }
  .b-adopted { background:#10b98122; color:#34d399; border:1px solid #10b98155; }
  .b-rejected { background:#ef444422; color:#f87171; border:1px solid #ef444455; }
  .exp-body { padding:12px 16px 16px; display:none; }
  .exp.open .exp-body { display:block; }
  .exp.open .arrow { transform:rotate(90deg); }
  .arrow { transition:.2s; color:#64748b; }
  /* 实验头部信息条 */
  .infobar { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:10px 0; }
  .info { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:12px; }
  .info b { color:#fbbf24; }
  .info .v { color:#cbd5e1; margin-top:2px; line-height:1.5; }
  .info.wide { grid-column:1/-1; }
  /* 变体来龙去脉故事卡 */
  .vcard { background:#0f172a; border:1px solid #334155; border-left:3px solid #475569; border-radius:10px; padding:12px; margin:10px 0; }
  .vcard.win { border-left-color:#34d399; background:#10b9810a; }
  .vhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .vname { font-weight:800; font-size:14px; color:#38bdf8; }
  .hp { display:inline-block; font-size:10px; padding:1px 7px; border-radius:6px; font-weight:700; }
  .hp-pass { background:#10b98122; color:#34d399; }
  .hp-fail { background:#ef444422; color:#f87171; }
  .story { display:grid; gap:4px; font-size:12px; margin-top:6px; }
  .story .row { display:flex; gap:8px; padding:3px 0; border-bottom:1px dashed #1e293b; }
  .story .row:last-child { border-bottom:none; }
  .story .ic { width:88px; flex-shrink:0; color:#64748b; font-size:11px; font-weight:600; padding-top:1px; }
  .story .tx { color:#cbd5e1; line-height:1.55; }
  .metrics { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .m { font-size:11px; padding:2px 8px; border-radius:6px; background:#1e293b; }
  .m b { font-size:12px; }
  .s-good { color:#34d399; } .s-mid { color:#fbbf24; } .s-bad { color:#f87171; }
  /* v4：视频左 / 参数右 */
  .vmain { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .vside { flex:0 0 230px; max-width:230px; }
  .vside video { width:100%; border-radius:8px; background:#000; }
  .vside .vh { font-size:11px; color:#64748b; text-align:center; margin-top:4px; }
  .pside { flex:1 1 320px; min-width:320px; }
  .ptable { width:100%; border-collapse:collapse; font-size:11.5px; }
  .ptable td { padding:4px 8px; border-bottom:1px dashed #1e293b; vertical-align:top; }
  .ptable .k { color:#64748b; font-weight:600; width:86px; white-space:nowrap; }
  .ptable .v { color:#cbd5e1; line-height:1.5; word-break:break-all; }
  .promptbox { max-height:84px; overflow-y:auto; font-family:ui-monospace,monospace; font-size:10.5px; color:#94a3b8; background:#0b1220; border:1px solid #1e293b; border-radius:6px; padding:6px; }
  .btn { font-size:11px; padding:4px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn-adopt { background:#10b981; color:#052e22; }
  .btn-reject { background:#334155; color:#94a3b8; }
  .btn:hover { opacity:.85; }
  .actions { margin-top:12px; display:flex; gap:8px; align-items:center; }
  .rule { background:#0f172a; border:1px solid #10b98144; border-radius:8px; padding:8px 12px; font-size:12px; margin:6px 0; color:#a7f3d0; }
  .rule b { color:#34d399; }
  .concl { background:#0f172a; border:1px solid #38bdf855; border-radius:8px; padding:10px 12px; font-size:12px; margin:10px 0; color:#bae6fd; }
  .concl b { color:#38bdf8; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
  .filter { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:4px 10px; font-size:12px; }
  .legend { font-size:11px; color:#64748b; }
  /* 图片放大查看（lightbox：滚轮缩放 + 拖动平移 + 双击复位） */
  #lb { display:none; position:fixed; inset:0; z-index:999; background:rgba(2,6,23,.94); padding:0; cursor:default; overflow:hidden; }
  #lb.open { display:block; }
  #lb .wrap { position:absolute; top:50%; left:50%; transform-origin:0 0; cursor:grab; }
  #lb .wrap:active { cursor:grabbing; }
  #lb img { display:block; max-width:none; max-height:none; border-radius:4px; box-shadow:0 10px 40px rgba(0,0,0,.6); user-select:none; }
  #lb .lbl { position:absolute; top:14px; left:50%; transform:translateX(-50%); color:#94a3b8; font-size:12px; background:rgba(2,6,23,.7); padding:2px 12px; border-radius:999px; pointer-events:none; }
  #lb .hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:#64748b; font-size:11px; background:rgba(2,6,23,.7); padding:2px 12px; border-radius:999px; pointer-events:none; }
  .kfimg { width:100%; height:auto; max-height:120px; object-fit:contain; background:#0b1220; border-radius:6px; border:1px solid #334155; cursor:zoom-in; transition:.15s; }
  .kfimg:hover { border-color:#38bdf8; }
</style>
</head>
<body>
<h1>🎓 提示词训练营 · 实验看板 v3</h1>
<div class="sub">每个变体的<b style="color:#38bdf8">来龙去脉</b>：解决什么 → 为什么 → 依据 → 怎么改 → 结果 → 问题 → 下一步。训练目标/样本/方法/进度/达标判断全部可见。</div>

<div class="stats" id="stats"></div>
<div class="toolbar">
  <select class="filter" id="fstatus">
    <option value="">全部状态</option>
    <option value="candidate">候选待审</option>
    <option value="adopted">已采纳</option>
    <option value="rejected">已拒绝</option>
  </select>
  <span class="legend">🎯 硬门槛：verdict=pass + face≥8 + 角色≥8（必须全过）｜哪个 fail 单独训哪个</span>
</div>
<div id="list"></div>

<div id="lb" onclick="if(event.target===this)closeLb()">
  <span class="lbl" id="lbl"></span>
  <div class="wrap" id="lbw"><img id="lbi" src="" alt=""></div>
  <span class="hint">滚轮缩放 · 拖动平移 · 双击复位 · 点击空白/Esc 关闭</span>
</div>

<script>
const ST = {done:['已完成','b-done'], candidate:['候选待审','b-candidate'], adopted:['已采纳','b-adopted'], rejected:['已拒绝','b-rejected']};
let EXPS = [];
let lbScale = 1, lbX = 0, lbY = 0, lbDrag = false, lbSX = 0, lbSY = 0;

function lbReset() {
  lbScale = 1; lbX = 0; lbY = 0;
  const w = document.getElementById('lbw');
  w.style.transform = 'translate(-50%,-50%) scale(1)';
}
function lbApply() {
  const w = document.getElementById('lbw');
  w.style.transform = 'translate(' + (lbX - 0) + 'px,' + (lbY - 0) + 'px) translate(-50%,-50%) scale(' + lbScale + ')';
}
function openLb(url, label) {
  document.getElementById('lbi').src = url;
  document.getElementById('lbl').textContent = label || '';
  document.getElementById('lb').classList.add('open');
  lbReset();
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }

const lbEl = document.getElementById('lb');
lbEl.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY < 0 ? 1.15 : 1/1.15;
  lbScale = Math.min(6, Math.max(0.3, lbScale * d));
  lbApply();
}, {passive:false});
lbEl.addEventListener('mousedown', e => {
  if (e.target.id !== 'lbi') return;
  lbDrag = true; lbSX = e.clientX; lbSY = e.clientY;
  document.getElementById('lbw').style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!lbDrag) return;
  lbX += e.clientX - lbSX; lbY += e.clientY - lbSY;
  lbSX = e.clientX; lbSY = e.clientY;
  lbApply();
});
window.addEventListener('mouseup', () => { lbDrag = false; document.getElementById('lbw').style.cursor = 'grab'; });
lbEl.addEventListener('dblclick', e => { if (e.target.id === 'lbi') lbReset(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

async function load() {
  try {
    const r = await fetch('/training/api/experiments');
    EXPS = (await r.json()).experiments || [];
    render();
  } catch(e) { document.getElementById('list').innerHTML = '<div class="note">加载失败: ' + e.message + '</div>'; }
}

function sc(v) { if (v==='-'||v===null||v===undefined) return ['s-mid','未检测']; v=Number(v); if (v>=8) return ['s-good',v]; if (v>=5) return ['s-mid',v]; return ['s-bad',v]; }
function chip(k, val, hp) {
  const [c, show] = sc(val);
  return '<span class="m">' + k + ' <b class="' + c + '">' + show + '</b>' +
    (hp !== undefined ? ' <span class="' + (hp ? 'hp-pass' : 'hp-fail') + '" style="font-size:9px">' + (hp?'✔':'✘') + '</span>' : '') + '</span>';
}
function vname(v) { return v.name || v.variant || v.id || '变体'; }

function variantCard(v, project) {
  const d = v.metrics || v.diagnosis || {};
  const hp = v.hard_detail || {};
  const hpB = k => hp[k] === true ? '<span class="hp hp-pass">✔ 达标</span>' : (hp[k] === false ? '<span class="hp hp-fail">✘ 未达标</span>' : '');
  const idl = v.identity_last || {};
  const ic = v.internal_consistency || {};
  const an = v.analysis || {};
  const rows = [
    ['🔍 问题', an.problem],
    ['🧩 原因', an.cause],
    ['💊 改进方案', an.fix],
    ['🎯 解决什么', v.goal],
    ['💡 为什么', v.hypothesis || v.hyp],
    ['📚 依据', v.reference],
    ['🔍 发现问题', v.finding],
    ['⏭ 下一步', v.next]
  ].filter(r => r[1]);
  const vText = v.verdict==='pass' ? '通过' : (v.verdict==='fail' ? '未通过' : (v.verdict==='warn' ? '需关注' : (v.verdict || '未检测')));
  const vCls = v.verdict==='pass' ? 's-good' : (v.verdict==='fail' ? 's-bad' : 's-mid');
  const metrics = [
    chip('连贯', d.continuity), chip('物理', d.physical), chip('角色', d.character, hp.character),
    chip('首尾', d.first_last), chip('人脸', d.face, hp.face), chip('画质', d.quality),
    '<span class="m">判定 <b class="' + vCls + '">' + vText + '</b></span>'
  ].join('');
  // 参数面板（v4.1：关键帧图 + 中文提示词 + 全参数）
  const p = v.params || {};
  const pRows = [];
  if (p.prompt_cn || p.prompt) {
    pRows.push(['中文提示词', p.prompt_cn ? '<div class="promptbox">' + p.prompt_cn + '</div>' : '（生成中）']);
    pRows.push(['英文提示词', '<div class="promptbox">' + (p.prompt || '') + '</div>']);
  }
  if (p.keyframes && p.keyframes.length) {
    const hasAnchor = p.keyframes.some(k => k.role === '角色锚点');
    const kfHtml = p.keyframes.map(k => {
      const src = k.src || '';
      const url = src.startsWith('http') ? src
        : (src.startsWith('assets/') ? '/projects/' + (project || '') + '/' + src : '');
      return '<div style="text-align:center"><div style="font-size:10px;color:#64748b;margin-bottom:2px">' + k.role + '</div>' +
        (url ? '<img src="' + url + '" class="kfimg" onclick="openLb(\'' + url + '\',\'' + k.role + '\')" onerror="this.style.display=\'none\'">' : '') + '</div>';
    }).join('');
    pRows.push(['关键帧图', '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px">' + kfHtml + '</div>' +
      '<div style="font-size:10px;color:#475569;margin-top:3px">' +
      (hasAnchor ? '关键帧动画：起点 → <b style="color:#fbbf24">角色锚点(脸锚)</b> → 尾帧，插值经过锚点脸锁定中间帧角色' :
                  '关键帧动画：起点 → 尾帧（无锚点，中间帧角色自由发挥）') +
      '</div><div style="font-size:10px;color:#475569;margin-top:2px">点击图片放大查看</div>']);
  }
  if (p.images) pRows.push(['关键帧数', p.images + ' 张']);
  if (p.num_frames) {
    const dur = (p.frame_rate ? (p.num_frames / p.frame_rate).toFixed(1) : null);
    pRows.push(['时长', p.num_frames + ' 帧' + (dur ? ' ≈ ' + dur + ' 秒' : '')]);
  }
  if (p.size) pRows.push(['尺寸', p.size]);
  if (p.frame_rate) pRows.push(['帧率', p.frame_rate + 'fps']);
  if (p.mode) pRows.push(['模式', p.mode === 'keyframes' ? '关键帧动画（首尾平滑插值）' : p.mode]);
  if (p.model) pRows.push(['模型', p.model]);
  if (p.seed) pRows.push(['随机种子', p.seed + '（可复现）']);
  if (p.negative) pRows.push(['负面词', p.negative]);
  const idlText = idl.verdict ? (idl.verdict==='pass' ? '一致 ✅' : idl.verdict==='fail' ? '不一致 ❌' : '轻微差异 ⚠') : '';
  return '<div class="vcard ' + (vname(v) === (EXPS.find(e=>(e.variants||[]).includes(v))||{}).candidate ? 'win' : '') + '">' +
    '<div class="vhead">' +
      '<span class="vname">变体 ' + vname(v) + '</span>' +
      (vname(v) === (EXPS.find(e=>(e.variants||[]).includes(v))||{}).candidate ? '<span class="hp hp-pass">🏆 候选</span>' : '') +
      '<span style="margin-left:auto;display:flex;gap:4px">' + hpB('verdict') + hpB('character') + hpB('face') + '</span>' +
    '</div>' +
    '<div class="vmain">' +
      '<div class="vside">' +
        (v.video ? '<video controls preload="none" src="/training/video/' + v.video.replace(/^experiments\//,'') + '"></video><div class="vh">🎬 生成视频（' + vname(v) + '）</div>' : '<div class="vh" style="padding:40px 0;text-align:center">视频未生成</div>') +
      '</div>' +
      '<div class="pside">' +
        '<div class="metrics">' + metrics + '</div>' +
        (idlText ? '<div class="metrics"><span class="m">尾帧脸型 <b class="' + (idl.verdict==='pass'?'s-good':idl.verdict==='fail'?'s-bad':'s-mid') + '">' + idlText + '</b></span>' +
          (idl.issues ? '<span class="m" style="color:#f87171">' + idl.issues + ' 个问题</span>' : '') + '</div>' : '') +
        (ic.verdict ? '<div class="metrics"><span class="m">内部一致(首帧vs尾帧) <b class="' + (ic.verdict==='pass'?'s-good':ic.verdict==='fail'?'s-bad':'s-mid') + '">' +
          (ic.verdict==='pass' ? '一致 ✅' : ic.verdict==='fail' ? '不一致 ❌（服装/外观变化）' : '需关注 ⚠') + '</b></span>' +
          ((ic.issues||[]).length ? '<span class="m" style="color:#f87171">' + ic.issues[0].desc.slice(0,46) + '</span>' : '') + '</div>' : '') +
        '<table class="ptable">' + pRows.map(r => '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>').join('') + '</table>' +
        '<div class="story">' + rows.map(r => '<div class="row"><span class="ic">' + r[0] + '</span><span class="tx">' + r[1] + '</span></div>').join('') + '</div>' +
      '</div>' +
    '</div></div>';
}

function expCard(e, isNewest) {
  const [stLabel, stCls] = ST[e.status] || ST.done;
  const hardInfo = e.threshold ? '硬门槛：' + (e.threshold.hard||[]).join(' / ') + ' 必须达标；软指标（' + (e.threshold.soft||[]).join(' / ') + '）尽量好' : '';
  return '<div class="exp ' + (isNewest ? 'open' : '') + '" id="' + e.id + '">' +
    '<div class="exp-head" onclick="toggle(this)">' +
      '<span class="arrow">▶</span><span class="exp-id">' + e.id + '</span>' +
      '<span class="exp-meta">' + (e.type||'') + ' · ' + (e.sample||'').slice(0,44) + ' · ' + (e.ts||'') + '</span>' +
      '<span class="badge ' + stCls + '">' + stLabel + '</span>' +
      (e.candidate ? '<span class="badge b-candidate">候选: ' + e.candidate + '</span>' : '') +
    '</div>' +
    '<div class="exp-body">' +
      '<div class="infobar">' +
        (e.goal ? '<div class="info wide"><b>🎯 训练目标</b><div class="v">' + e.goal + '</div></div>' : '') +
        (e.sample ? '<div class="info"><b>📌 样本</b><div class="v">' + e.sample + '</div></div>' : '') +
        (e.progress ? '<div class="info"><b>📈 训练进度</b><div class="v">' + e.progress + '</div></div>' : '') +
        (hardInfo ? '<div class="info"><b>📐 达标标准</b><div class="v">' + hardInfo + '</div></div>' : '') +
      '</div>' +
      (e.key_finding ? '<div class="concl"><b>💡 关键机制发现</b>：' + e.key_finding + '</div>' : '') +
      (e.candidate_note ? '<div class="concl"><b>🏆 候选方案</b>：' + e.candidate_note + '</div>' : '') +
      '<div style="font-size:11px;color:#64748b;margin:6px 0">▼ 各变体的来龙去脉（点开看完整故事线）</div>' +
      (e.variants||[]).map(v => variantCard(v, e.project)).join('') +
      ((e.rules_draft||[]).length ? '<div style="margin-top:10px">' + e.rules_draft.map(r => '<div class="rule">📌 <b>规则草案</b> ' + r + '</div>').join('') + '</div>' : '') +
      (e.qc_lesson ? '<div class="concl"><b>📋 质检教训</b>：' + e.qc_lesson + '</div>' : '') +
      '<div class="actions">' +
        (e.status === 'candidate' ?
          '<button class="btn btn-adopt" onclick="setStatus(\'' + e.id + '\',\'adopted\')">✅ 采纳此方案（固化进工作台）</button>' +
          '<button class="btn btn-reject" onclick="setStatus(\'' + e.id + '\',\'rejected\')">❌ 拒绝</button>' : '') +
        '<span class="note" style="color:#64748b;font-size:11px">' + (e.reviewed_ts ? '老板已审查：' + e.reviewed_ts : '') + '</span>' +
      '</div>' +
    '</div></div>';
}

function render() {
  const f = document.getElementById('fstatus').value;
  const list = f ? EXPS.filter(e => e.status === f) : EXPS;
  const cnt = {done:0, candidate:0, adopted:0, rejected:0};
  EXPS.forEach(e => cnt[e.status] = (cnt[e.status]||0)+1);
  document.getElementById('stats').innerHTML =
    '<div class="stat">实验总数 <b>' + EXPS.length + '</b></div>' +
    '<div class="stat">候选待审 <b style="color:#fbbf24">' + cnt.candidate + '</b></div>' +
    '<div class="stat">已采纳 <b style="color:#34d399">' + cnt.adopted + '</b></div>' +
    '<div class="stat">已拒绝 <b style="color:#f87171">' + cnt.rejected + '</b></div>';
  document.getElementById('list').innerHTML = list.length
    ? list.map((e, i) => { try { return expCard(e, i === 0); } catch(err) { return '<div class="note" style="color:#f87171">⚠ 实验渲染错误: ' + (err.message || err) + '</div>'; } }).join('')
    : '<div class="note">暂无实验。</div>';
}

function toggle(head) { head.parentElement.classList.toggle('open'); }

async function setStatus(id, status) {
  if (status==='adopted' && !confirm('确认采纳该候选方案，由阿编固化进工作台正式流程？')) return;
  const r = await fetch('/training/api/experiments/' + id + '/status', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})
  });
  const d = await r.json();
  if (d.ok) load(); else alert('操作失败: ' + (d.error||''));
}

document.getElementById('fstatus').addEventListener('change', render);
load();
</script>
</body>
</html>
