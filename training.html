<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 提示词训练营 · 实验看板 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:12px; margin-bottom:16px; }
  .stats { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:8px 14px; font-size:12px; }
  .stat b { color:#38bdf8; }
  .exp { background:#1e293b; border:1px solid #334155; border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .exp-head { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; flex-wrap:wrap; }
  .exp-head:hover { background:#243449; }
  .exp-id { font-weight:700; font-size:14px; color:#38bdf8; }
  .exp-meta { color:#94a3b8; font-size:11px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .b-done { background:#334155; color:#94a3b8; }
  .b-candidate { background:#f59e0b22; color:#fbbf24; border:1px solid #f59e0b55; }
  .b-adopted { background:#10b98122; color:#34d399; border:1px solid #10b98155; }
  .b-rejected { background:#ef444422; color:#f87171; border:1px solid #ef444455; }
  .exp-body { padding:0 16px 16px; display:none; }
  .exp.open .exp-body { display:block; }
  .exp.open .arrow { transform:rotate(90deg); }
  .arrow { transition:.2s; color:#64748b; }
  .finding { background:#0f172a; border:1px solid #38bdf855; border-radius:8px; padding:10px 12px; font-size:12px; margin:8px 0; color:#bae6fd; }
  .note { color:#94a3b8; font-size:11px; }
  .goalbar { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:10px 12px; font-size:12px; margin:8px 0; }
  .goalbar b { color:#fbbf24; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin:8px 0; }
  th { background:#243449; color:#94a3b8; padding:6px 8px; text-align:left; font-weight:600; }
  td { padding:6px 8px; border-bottom:1px solid #1e293b; vertical-align:top; }
  .score { font-weight:700; }
  .s-good { color:#34d399; } .s-mid { color:#fbbf24; } .s-bad { color:#f87171; }
  .win { background:#10b98114; }
  .btn { font-size:11px; padding:4px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn-adopt { background:#10b981; color:#052e22; }
  .btn-reject { background:#334155; color:#94a3b8; }
  .btn:hover { opacity:.85; }
  .actions { margin-top:10px; display:flex; gap:8px; align-items:center; }
  video { width:100%; max-width:200px; border-radius:8px; background:#000; }
  .vid-wrap { display:flex; gap:12px; flex-wrap:wrap; }
  .vid-card { width:200px; }
  .vid-card .vh { font-size:11px; color:#94a3b8; margin-bottom:4px; text-align:center; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  .filter { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:4px 10px; font-size:12px; }
  .legend { font-size:11px; color:#64748b; }
  .vartable { width:100%; border-collapse:collapse; margin:8px 0; }
  .vartable th { background:#0f172a; color:#64748b; font-size:11px; padding:5px 8px; text-align:left; border-bottom:1px solid #334155; }
  .vartable td { font-size:11px; padding:5px 8px; border-bottom:1px solid #1e293b; vertical-align:top; }
  .k { color:#64748b; font-weight:600; width:70px; white-space:nowrap; }
  .hp { display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px; font-weight:700; margin-left:4px; }
  .hp-pass { background:#10b98122; color:#34d399; }
  .hp-fail { background:#ef444422; color:#f87171; }
  .rule { background:#0f172a; border:1px solid #10b98144; border-radius:8px; padding:8px 12px; font-size:12px; margin:6px 0; color:#a7f3d0; }
  .rule b { color:#34d399; }
  .progress { height:8px; background:#334155; border-radius:999px; overflow:hidden; margin:8px 0; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg,#38bdf8,#34d399); }
</style>
</head>
<body>
<h1>🎓 提示词训练营 · 实验看板 v2</h1>
<div class="sub">训练科学：分镜头类型 → 假设驱动变体（6 要素卡片）→ 分层达标（硬门槛全过）→ 您审查采纳 → 固化进工作台</div>

<div class="stats" id="stats"></div>
<div class="toolbar">
  <select class="filter" id="fstatus">
    <option value="">全部状态</option>
    <option value="candidate">候选待审</option>
    <option value="adopted">已采纳</option>
    <option value="rejected">已拒绝</option>
  </select>
  <span class="legend">🎯 硬门槛：verdict=pass + face≥8 + 角色≥8（必须全过）｜软指标尽量好不设死线｜哪个 fail 单独训哪个</span>
</div>
<div id="list"></div>

<script>
const ST = {done:['已完成','b-done'], candidate:['候选待审','b-candidate'], adopted:['已采纳','b-adopted'], rejected:['已拒绝','b-rejected']};
const HARD = ['verdict','face','character'];
const SOFT = ['continuity','physical','first_last'];
let EXPS = [];

async function load() {
  try {
    const r = await fetch('/training/api/experiments');
    const d = await r.json();
    EXPS = d.experiments || [];
    render();
  } catch(e) { document.getElementById('list').innerHTML = '<div class="note">加载失败: ' + e.message + '</div>'; }
}

function scoreCls(v) { if (v==='-'||v===null||v===undefined) return ['-','-']; v=Number(v); if (v>=8) return ['s-good',v]; if (v>=5) return ['s-mid',v]; return ['s-bad',v]; }

function metricCell(k, val) {
  const [c, show] = scoreCls(val);
  return '<span class="score ' + c + '">' + (show==='-'?'-':show) + '</span>';
}

function variantRow(v) {
  const d = v.metrics || {};
  const isWin = v.name === (EXPS.find(e=>e.variants && e.variants.includes(v)) || {}).candidate;
  const hp = v.hard_detail || {};
  const hpBadge = (k) => hp[k] === true ? '<span class="hp hp-pass">✔</span>' : (hp[k] === false ? '<span class="hp hp-fail">✘</span>' : '');
  const idl = v.identity_last || {};
  return '<tr class="' + (isWin?'win':'') + '">' +
    '<td><b>' + v.name + '</b>' + (isWin?' 🏆':'') + '</td>' +
    '<td>' + metricCell('continuity', d.continuity) + '</td>' +
    '<td>' + metricCell('physical', d.physical) + '</td>' +
    '<td>' + metricCell('character', d.character) + hpBadge('character') + '</td>' +
    '<td>' + metricCell('first_last', d.first_last) + '</td>' +
    '<td>' + metricCell('face', d.face) + hpBadge('face') + '</td>' +
    '<td>' + (v.verdict==='pass'?'<span class="s-good">PASS</span>':v.verdict==='fail'?'<span class="s-bad">FAIL</span>':'<span class="s-mid">'+(v.verdict||'-')+'</span>') + hpBadge('verdict') + '</td>' +
    '<td>' + (idl.verdict ? '<span class="'+(idl.verdict==='pass'?'s-good':idl.verdict==='fail'?'s-bad':'s-mid')+'">'+idl.verdict.toUpperCase()+'</span>'+(idl.issues?' <span class="note">('+idl.issues+'问题)</span>':'') : '-') + '</td>' +
    '<td>' + (v.video ? '<video controls preload="none" src="/training/video/' + v.video.replace(/^experiments\//,'') + '" style="max-width:150px"></video>' : '') + '</td></tr>';
}

function variantCard(v) {
  const fields = [
    ['🎯 目标', v.goal], ['💡 假设', v.hypothesis], ['⚙️ 实现', v.implement],
    ['📚 参考', v.reference], ['🔍 发现', v.finding], ['⏭ 下一步', v.next]
  ].filter(f => f[1]);
  return '<table class="vartable"><tbody>' +
    fields.map(f => '<tr><td class="k">' + f[0] + '</td><td>' + f[1] + '</td></tr>').join('') +
    '</tbody></table>';
}

function expCard(e) {
  const [stLabel, stCls] = ST[e.status] || ST.done;
  const rows = (e.variants||[]).map(variantRow).join('');
  const cards = (e.variants||[]).map(v =>
    '<div style="border:1px solid #334155;border-radius:10px;padding:10px;margin:8px 0;background:#0f172a;">' +
    '<b style="color:#38bdf8">' + v.name + '</b> ' +
    (v.hyp ? '<span class="note">· ' + v.hyp + '</span>' : '') +
    variantCard(v) + '</div>').join('');
  const rules = (e.rules_draft||[]).map(r => '<div class="rule">📌 <b>规则草案</b> ' + r + '</div>').join('');
  const prog = (e.progress||'').split(':');
  return '<div class="exp ' + (e.status==='candidate'?'open':'') + '" id="' + e.id + '">' +
    '<div class="exp-head" onclick="toggle(this)">' +
      '<span class="arrow">▶</span><span class="exp-id">' + e.id + '</span>' +
      '<span class="exp-meta">' + (e.type||'') + ' · ' + (e.sample||'').slice(0,40) + ' · ' + e.ts + '</span>' +
      '<span class="badge ' + stCls + '">' + stLabel + '</span>' +
      (e.candidate ? '<span class="badge b-candidate">候选: ' + e.candidate + '</span>' : '') +
    '</div>' +
    '<div class="exp-body">' +
      '<div class="goalbar">🎯 <b>训练目标</b>：' + (e.goal||'') + '</div>' +
      (e.key_finding ? '<div class="finding">💡 <b>关键机制发现</b>：' + e.key_finding + '</div>' : '') +
      (e.candidate_note ? '<div class="finding">🏆 <b>候选方案</b>：' + e.candidate_note + '</div>' : '') +
      (prog.length>1 ? '<div class="note">📈 训练进度：' + prog[1] + '</div>' : '') +
      '<table><tr><th>变体</th><th>连贯</th><th>物理</th><th>角色</th><th>首尾</th><th>face</th><th>verdict</th><th>视觉脸型(尾帧)</th><th>视频</th></tr>' + rows + '</table>' +
      '<div class="note">✔/✘ = 硬门槛（角色/face/verdict 必须达标）；点击下方变体卡片看设计细节</div>' +
      cards +
      rules +
      (e.qc_lesson ? '<div class="note">📋 质检教训：' + e.qc_lesson + '</div>' : '') +
      '<div class="actions">' +
        (e.status === 'candidate' ?
          '<button class="btn btn-adopt" onclick="setStatus(\'' + e.id + '\',\'adopted\')">✅ 采纳此方案（固化进工作台）</button>' +
          '<button class="btn btn-reject" onclick="setStatus(\'' + e.id + '\',\'rejected\')">❌ 拒绝</button>' : '') +
        '<span class="note">' + (e.reviewed_ts ? '老板已审查：' + e.reviewed_ts : '') + '</span>' +
      '</div>' +
    '</div></div>';
}

function render() {
  const f = document.getElementById('fstatus').value;
  const list = f ? EXPS.filter(e => e.status === f) : EXPS;
  const cnt = {done:0, candidate:0, adopted:0, rejected:0};
  EXPS.forEach(e => cnt[e.status] = (cnt[e.status]||0)+1);
  document.getElementById('stats').innerHTML =
    '<div class="stat">实验总数 <b>' + EXPS.length + '</b></div>' +
    '<div class="stat">候选待审 <b style="color:#fbbf24">' + cnt.candidate + '</b></div>' +
    '<div class="stat">已采纳 <b style="color:#34d399">' + cnt.adopted + '</b></div>' +
    '<div class="stat">已拒绝 <b style="color:#f87171">' + cnt.rejected + '</b></div>';
  if (!list.length) { document.getElementById('list').innerHTML = '<div class="note">暂无实验。</div>'; return; }
  document.getElementById('list').innerHTML = list.map(expCard).join('');
}

function toggle(head) { head.parentElement.classList.toggle('open'); }

async function setStatus(id, status) {
  if (status==='adopted' && !confirm('确认采纳该候选方案，由阿编固化进工作台正式流程？')) return;
  const r = await fetch('/training/api/experiments/' + id + '/status', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})
  });
  const d = await r.json();
  if (d.ok) load(); else alert('操作失败: ' + (d.error||''));
}

document.getElementById('fstatus').addEventListener('change', render);
load();
</script>
</body>
</html>
