<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 提示词训练营 · 实验看板 v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:12px; margin-bottom:16px; }
  .stats { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:8px 14px; font-size:12px; }
  .stat b { color:#38bdf8; }
  .exp { background:#1e293b; border:1px solid #334155; border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .exp-head { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; flex-wrap:wrap; }
  .exp-head:hover { background:#243449; }
  .exp-id { font-weight:700; font-size:14px; color:#38bdf8; }
  .exp-meta { color:#94a3b8; font-size:11px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .b-done { background:#334155; color:#94a3b8; }
  .b-candidate { background:#f59e0b22; color:#fbbf24; border:1px solid #f59e0b55; }
  .b-adopted { background:#10b98122; color:#34d399; border:1px solid #10b98155; }
  .b-rejected { background:#ef444422; color:#f87171; border:1px solid #ef444455; }
  .exp-body { padding:12px 16px 16px; display:none; }
  .exp.open .exp-body { display:block; }
  .exp.open .arrow { transform:rotate(90deg); }
  .arrow { transition:.2s; color:#64748b; }
  /* 实验头部信息条 */
  .infobar { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:10px 0; }
  .info { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:12px; }
  .info b { color:#fbbf24; }
  .info .v { color:#cbd5e1; margin-top:2px; line-height:1.5; }
  .info.wide { grid-column:1/-1; }
  /* 变体来龙去脉故事卡 */
  .vcard { background:#0f172a; border:1px solid #334155; border-left:3px solid #475569; border-radius:10px; padding:12px; margin:10px 0; }
  .vcard.win { border-left-color:#34d399; background:#10b9810a; }
  .vhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .vname { font-weight:800; font-size:14px; color:#38bdf8; }
  .hp { display:inline-block; font-size:10px; padding:1px 7px; border-radius:6px; font-weight:700; }
  .hp-pass { background:#10b98122; color:#34d399; }
  .hp-fail { background:#ef444422; color:#f87171; }
  .story { display:grid; gap:4px; font-size:12px; }
  .story .row { display:flex; gap:8px; padding:3px 0; border-bottom:1px dashed #1e293b; }
  .story .row:last-child { border-bottom:none; }
  .story .ic { width:88px; flex-shrink:0; color:#64748b; font-size:11px; font-weight:600; padding-top:1px; }
  .story .tx { color:#cbd5e1; line-height:1.55; }
  .metrics { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .m { font-size:11px; padding:2px 8px; border-radius:6px; background:#1e293b; }
  .m b { font-size:12px; }
  .s-good { color:#34d399; } .s-mid { color:#fbbf24; } .s-bad { color:#f87171; }
  video { width:100%; max-width:180px; border-radius:8px; background:#000; }
  .vids { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .btn { font-size:11px; padding:4px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn-adopt { background:#10b981; color:#052e22; }
  .btn-reject { background:#334155; color:#94a3b8; }
  .btn:hover { opacity:.85; }
  .actions { margin-top:12px; display:flex; gap:8px; align-items:center; }
  .rule { background:#0f172a; border:1px solid #10b98144; border-radius:8px; padding:8px 12px; font-size:12px; margin:6px 0; color:#a7f3d0; }
  .rule b { color:#34d399; }
  .concl { background:#0f172a; border:1px solid #38bdf855; border-radius:8px; padding:10px 12px; font-size:12px; margin:10px 0; color:#bae6fd; }
  .concl b { color:#38bdf8; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
  .filter { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:4px 10px; font-size:12px; }
  .legend { font-size:11px; color:#64748b; }
</style>
</head>
<body>
<h1>🎓 提示词训练营 · 实验看板 v3</h1>
<div class="sub">每个变体的<b style="color:#38bdf8">来龙去脉</b>：解决什么 → 为什么 → 依据 → 怎么改 → 结果 → 问题 → 下一步。训练目标/样本/方法/进度/达标判断全部可见。</div>

<div class="stats" id="stats"></div>
<div class="toolbar">
  <select class="filter" id="fstatus">
    <option value="">全部状态</option>
    <option value="candidate">候选待审</option>
    <option value="adopted">已采纳</option>
    <option value="rejected">已拒绝</option>
  </select>
  <span class="legend">🎯 硬门槛：verdict=pass + face≥8 + 角色≥8（必须全过）｜哪个 fail 单独训哪个</span>
</div>
<div id="list"></div>

<script>
const ST = {done:['已完成','b-done'], candidate:['候选待审','b-candidate'], adopted:['已采纳','b-adopted'], rejected:['已拒绝','b-rejected']};
let EXPS = [];

async function load() {
  try {
    const r = await fetch('/training/api/experiments');
    EXPS = (await r.json()).experiments || [];
    render();
  } catch(e) { document.getElementById('list').innerHTML = '<div class="note">加载失败: ' + e.message + '</div>'; }
}

function sc(v) { if (v==='-'||v===null||v===undefined) return ['-','-']; v=Number(v); if (v>=8) return ['s-good',v]; if (v>=5) return ['s-mid',v]; return ['s-bad',v]; }
function chip(k, val, hp) {
  const [c, show] = sc(val);
  return '<span class="m">' + k + ' <b class="' + c + '">' + (show==='-'?'-':show) + '</b>' +
    (hp !== undefined ? ' <span class="' + (hp ? 'hp-pass' : 'hp-fail') + '" style="font-size:9px">' + (hp?'✔':'✘') + '</span>' : '') + '</span>';
}

function variantCard(v) {
  const d = v.metrics || {};
  const hp = v.hard_detail || {};
  const hpB = k => hp[k] === true ? '<span class="hp hp-pass">✔ 达标</span>' : (hp[k] === false ? '<span class="hp hp-fail">✘ 未达标</span>' : '');
  const idl = v.identity_last || {};
  const rows = [
    ['🎯 解决什么', v.goal],
    ['💡 为什么', v.hypothesis],
    ['📚 依据', v.reference],
    ['⚙️ 怎么改', v.implement],
    ['🔍 发现问题', v.finding],
    ['⏭ 下一步', v.next]
  ].filter(r => r[1]);
  const metrics = [
    chip('连贯', d.continuity), chip('物理', d.physical), chip('角色', d.character, hp.character),
    chip('首尾', d.first_last), chip('face', d.face, hp.face), chip('quality', d.quality),
    chip('verdict', v.verdict==='pass'?10:(v.verdict==='fail'?2:5), hp.verdict)
  ].join('');
  return '<div class="vcard ' + (v.name === (EXPS.find(e=>(e.variants||[]).includes(v))||{}).candidate ? 'win' : '') + '">' +
    '<div class="vhead">' +
      '<span class="vname">变体 ' + v.name + '</span>' +
      (v.name === (EXPS.find(e=>(e.variants||[]).includes(v))||{}).candidate ? '<span class="hp hp-pass">🏆 候选</span>' : '') +
      '<span style="margin-left:auto;display:flex;gap:4px">' + hpB('verdict') + hpB('character') + hpB('face') + '</span>' +
    '</div>' +
    '<div class="metrics">' + metrics + '</div>' +
    '<div class="story">' + rows.map(r => '<div class="row"><span class="ic">' + r[0] + '</span><span class="tx">' + r[1] + '</span></div>').join('') + '</div>' +
    (idl.verdict ? '<div class="metrics" style="margin-top:6px">' +
      '<span class="m">尾帧脸型 <b class="' + (idl.verdict==='pass'?'s-good':idl.verdict==='fail'?'s-bad':'s-mid') + '">' + idl.verdict.toUpperCase() + '</b></span>' +
      (idl.issues ? '<span class="m" style="color:#f87171">' + idl.issues + ' 个问题</span>' : '') + '</div>' : '') +
    (v.video ? '<div class="vids"><video controls preload="none" src="/training/video/' + v.video.replace(/^experiments\//,'') + '"></video></div>' : '') +
    '</div>';
}

function expCard(e) {
  const [stLabel, stCls] = ST[e.status] || ST.done;
  const hardInfo = e.threshold ? '硬门槛：' + (e.threshold.hard||[]).join(' / ') + ' 必须达标；软指标（' + (e.threshold.soft||[]).join(' / ') + '）尽量好' : '';
  return '<div class="exp ' + (e.status==='candidate'?'open':'') + '" id="' + e.id + '">' +
    '<div class="exp-head" onclick="toggle(this)">' +
      '<span class="arrow">▶</span><span class="exp-id">' + e.id + '</span>' +
      '<span class="exp-meta">' + (e.type||'') + ' · ' + (e.sample||'').slice(0,44) + ' · ' + e.ts + '</span>' +
      '<span class="badge ' + stCls + '">' + stLabel + '</span>' +
      (e.candidate ? '<span class="badge b-candidate">候选: ' + e.candidate + '</span>' : '') +
    '</div>' +
    '<div class="exp-body">' +
      '<div class="infobar">' +
        (e.goal ? '<div class="info wide"><b>🎯 训练目标</b><div class="v">' + e.goal + '</div></div>' : '') +
        (e.sample ? '<div class="info"><b>📌 样本</b><div class="v">' + e.sample + '</div></div>' : '') +
        (e.progress ? '<div class="info"><b>📈 训练进度</b><div class="v">' + e.progress + '</div></div>' : '') +
        (hardInfo ? '<div class="info"><b>📐 达标标准</b><div class="v">' + hardInfo + '</div></div>' : '') +
      '</div>' +
      (e.key_finding ? '<div class="concl"><b>💡 关键机制发现</b>：' + e.key_finding + '</div>' : '') +
      (e.candidate_note ? '<div class="concl"><b>🏆 候选方案</b>：' + e.candidate_note + '</div>' : '') +
      '<div style="font-size:11px;color:#64748b;margin:6px 0">▼ 各变体的来龙去脉（点开看完整故事线）</div>' +
      (e.variants||[]).map(variantCard).join('') +
      ((e.rules_draft||[]).length ? '<div style="margin-top:10px">' + e.rules_draft.map(r => '<div class="rule">📌 <b>规则草案</b> ' + r + '</div>').join('') + '</div>' : '') +
      (e.qc_lesson ? '<div class="concl"><b>📋 质检教训</b>：' + e.qc_lesson + '</div>' : '') +
      '<div class="actions">' +
        (e.status === 'candidate' ?
          '<button class="btn btn-adopt" onclick="setStatus(\'' + e.id + '\',\'adopted\')">✅ 采纳此方案（固化进工作台）</button>' +
          '<button class="btn btn-reject" onclick="setStatus(\'' + e.id + '\',\'rejected\')">❌ 拒绝</button>' : '') +
        '<span class="note" style="color:#64748b;font-size:11px">' + (e.reviewed_ts ? '老板已审查：' + e.reviewed_ts : '') + '</span>' +
      '</div>' +
    '</div></div>';
}

function render() {
  const f = document.getElementById('fstatus').value;
  const list = f ? EXPS.filter(e => e.status === f) : EXPS;
  const cnt = {done:0, candidate:0, adopted:0, rejected:0};
  EXPS.forEach(e => cnt[e.status] = (cnt[e.status]||0)+1);
  document.getElementById('stats').innerHTML =
    '<div class="stat">实验总数 <b>' + EXPS.length + '</b></div>' +
    '<div class="stat">候选待审 <b style="color:#fbbf24">' + cnt.candidate + '</b></div>' +
    '<div class="stat">已采纳 <b style="color:#34d399">' + cnt.adopted + '</b></div>' +
    '<div class="stat">已拒绝 <b style="color:#f87171">' + cnt.rejected + '</b></div>';
  document.getElementById('list').innerHTML = list.length ? list.map(expCard).join('') : '<div class="note">暂无实验。</div>';
}

function toggle(head) { head.parentElement.classList.toggle('open'); }

async function setStatus(id, status) {
  if (status==='adopted' && !confirm('确认采纳该候选方案，由阿编固化进工作台正式流程？')) return;
  const r = await fetch('/training/api/experiments/' + id + '/status', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status})
  });
  const d = await r.json();
  if (d.ok) load(); else alert('操作失败: ' + (d.error||''));
}

document.getElementById('fstatus').addEventListener('change', render);
load();
</script>
</body>
</html>
